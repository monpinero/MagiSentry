name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: ruff check magisentry/ --select E,F,W --ignore E501

  i18n-parity:
    name: i18n parity (en.json == sk.json)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check locale parity
        run: |
          python - <<'EOF'
          import json, sys
          en = json.load(open("magisentry/locales/en.json"))
          sk = json.load(open("magisentry/locales/sk.json"))
          only_en = set(en) - set(sk)
          only_sk = set(sk) - set(en)
          ok = True
          if only_en:
              print(f"MISSING in sk.json: {sorted(only_en)}")
              ok = False
          if only_sk:
              print(f"MISSING in en.json: {sorted(only_sk)}")
              ok = False
          if ok:
              print(f"OK — parity preserved ({len(en)} keys each)")
          sys.exit(0 if ok else 1)
          EOF

  smoke-test:
    name: Smoke test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install MagiSentry (core)
        run: pip install -e ".[core]"
      - name: Pre-create CI config (skip first-run wizard)
        run: |
          python - <<'EOF'
          import json
          from pathlib import Path
          cfg_dir = Path.home() / ".magisentry"
          cfg_dir.mkdir(exist_ok=True)
          config = {
              "mode": "failsafe",
              "language": "en",
              "notifications": False,
              "steps": {
                  "registry_check": True,
                  "osv_check": True,
                  "pip_audit": False,
                  "isolated_download": True,
                  "virustotal": False,
                  "magika": False,
                  "semgrep": False,
                  "yara": False,
                  "vscode_scan": False,
                  "dockerfile_scan": False
              }
          }
          (cfg_dir / "config.json").write_text(json.dumps(config))
          print("CI config created")
          EOF
      - name: Positive smoke test — known-good package
        run: magisentry pip install requests
      - name: Negative smoke test — known CVE (urllib3==1.24.1)
        run: |
          python - <<'EOF'
          import subprocess, sys
          r = subprocess.run(
              ["magisentry", "pip", "install", "urllib3==1.24.1"],
              capture_output=True,
          )
          if r.returncode == 1:
              print("FAIL: scanner crashed (exit 1 = technical error)")
              sys.stderr.write(r.stderr.decode("utf-8", "replace"))
              sys.exit(1)
          print(f"OK: urllib3==1.24.1 returned exit {r.returncode} (0=clean, 2=CVE)")
          EOF

  publish:
    name: Publish to PyPI
    needs: [lint, i18n-parity, smoke-test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools
        run: pip install build
      - name: Build distribution
        run: python -m build
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*

